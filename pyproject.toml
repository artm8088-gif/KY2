[project]
name = "dependency-visualizer"
version = "0.1.0"
description = "Инструмент визуализации графа зависимостей для менеджера пакетов"
requires-python = ">=3.10"

# =========================================================
# Ruff — минимальная конфигурация
# =========================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Только реальные ошибки, никакого стиля.
select = [
    "F",   # pyflakes — логические ошибки (неиспользуемые импорты, undefined)
    "E9",  # только серьёзные ошибки pycodestyle (E9xx), без E501
]

ignore = [
    "RUF001",  # кириллица в строках
    "RUF002",  # кириллица в docstring
    "RUF003",  # кириллица в комментариях
]