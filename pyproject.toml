[project]
name = "dependency-visualizer"
version = "0.1.0"
description = "Инструмент визуализации графа зависимостей для менеджера пакетов"
requires-python = ">=3.10"

# =========================================================
# Ruff — конфигурация под перечень нарушений преподавателя
# =========================================================
[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # P2 — длинные строки (E501)
    "W",    # предупреждения
    "F",    # pyflakes
    "I",    # isort
    "N",    # И1 — имена по PEP 8
    "D",    # K1 — docstring вместо комментариев
    "C90",  # Ц1 — цикломатическая сложность
    "PL",   # M1 — магические числа, Ф1 — длина функции
]

ignore = [
    "D203",   # конфликт с D211
    "D213",   # конфликт с D212
    "RUF001", # кириллица в строках
    "RUF002", # кириллица в docstring
    "RUF003", # кириллица в комментариях
]

# ---------------------------------------------------------
# P2. Максимальная длина строки — 80
# (задано в [tool.ruff] line-length = 80)
# ---------------------------------------------------------

# ---------------------------------------------------------
# Ц1. Цикломатическая сложность (правило Ц1, >10)
# ---------------------------------------------------------
[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------
# K1. Docstring вместо комментариев
# ---------------------------------------------------------
[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------
# M1 + Ф1. Магические числа + длина функции >40 строк
# ---------------------------------------------------------
[tool.ruff.lint.pylint]
allow-magic-value-types = ["str"]  # магические числа запрещены
max-statements = 40                # Ф1 — не больше 40 строк в функции